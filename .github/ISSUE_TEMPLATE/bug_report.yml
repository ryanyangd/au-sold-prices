name: Bug report
description: Report something broken in the app, pipeline or deployment
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Web app, API, Data pipeline, Infrastructure / deployment, Other]
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options: [Local, Dev, Prod]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
      description: Include the address or page URL, and a screenshot if it helps. Do not paste secrets or personal data.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error text
      render: text
