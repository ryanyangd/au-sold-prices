name: Data refresh

# Runs the cloud data pipeline for one environment as a Databricks job: download the source file
# into a volume, then bronze -> silver -> gold -> Postgres. Runs after every deployment and
# can be run by hand (for example after uploading a CSV with scripts/upload_csv.py).
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  refresh:
    name: Refresh data (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      AUSOLD_PG_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: databricks/setup-cli@main

      - name: Make sure Postgres is running
        run: sh scripts/ci/ensure-postgres.sh "$ENVIRONMENT"

      - name: Run the Databricks pipeline
        run: sh scripts/ci/databricks-run.sh

      - name: Verify the API serves the new data
        run: |
          OUT="$(az deployment sub show -n "ausold-${ENVIRONMENT}" --query properties.outputs -o json)"
          API="$(echo "$OUT" | jq -r .apiUrl.value)"
          curl -fsS "$API/search/addresses?q=george%20st" | tee /tmp/search.json
          grep -q '"property_id"' /tmp/search.json || { echo "Search returned no properties" >&2; exit 1; }

  report-failure:
    needs: refresh
    if: failure() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Open a bug issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Data refresh failed (${{ inputs.environment }})" \
            --label bug --label data-pipeline \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
