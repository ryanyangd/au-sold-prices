bundle:
  name: ausold-lakehouse

# Bring the shared pipeline SQL/Python (../../src) along; paths below are relative to this file.
sync:
  paths:
    - ../../src
    - .

variables:
  catalog:
    description: >-
      Unity Catalog catalog to use. Every new Azure Databricks workspace comes with one named
      after the workspace (dbw-ausold-dev -> dbw_ausold_dev), backed by Databricks-managed storage.
  alert_email:
    description: Address notified when the job fails
  grant_select_to:
    description: Postgres role the API uses (read-only access to the serving schema)
    default: ""

resources:
  jobs:
    nsw_sales_pipeline:
      name: nsw-sales-pipeline-${bundle.target}
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: Australia/Sydney
      email_notifications:
        on_failure:
          - ${var.alert_email}
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ./ingest_nsw_psi.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: bronze
          depends_on:
            - task_key: ingest
          notebook_task:
            notebook_path: ./bronze_nsw_psi_raw.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: silver_gold
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ./silver_gold.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: load_serving
          depends_on:
            - task_key: silver_gold
          notebook_task:
            notebook_path: ./load_serving.py
            base_parameters:
              catalog: ${var.catalog}
              grant_select_to: ${var.grant_select_to}

# The workspace host comes from DATABRICKS_HOST and credentials from the Azure CLI login
# (DATABRICKS_AUTH_TYPE=azure-cli with DATABRICKS_AZURE_RESOURCE_ID), so one file serves both
# environments. Tasks have no cluster, so they run on serverless compute.
targets:
  dev:
    workspace:
      root_path: /Shared/.bundle/${bundle.name}/dev
  prod:
    workspace:
      root_path: /Shared/.bundle/${bundle.name}/prod
