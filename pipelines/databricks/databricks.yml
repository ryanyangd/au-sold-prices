bundle:
  name: ausold-lakehouse

# Bring the shared pipeline SQL/Python (../../src) along; paths below are relative to this file.
sync:
  paths:
    - ../../src
    - .

variables:
  lake_account:
    description: Name of the ADLS Gen2 lake account (output `lakeStorageName` of infra/main.bicep)
  catalog:
    default: ausold
  grant_select_to:
    description: Postgres role the API uses (read-only access to the serving schema)
    default: ""

resources:
  jobs:
    nsw_sales_pipeline:
      name: nsw-sales-pipeline-${bundle.target}
      schedule:
        quartz_cron_expression: "0 0 7 * * ?"
        timezone_id: Australia/Sydney
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./bronze_nsw_psi_raw.py
            base_parameters:
              lake_account: ${var.lake_account}
              catalog: ${var.catalog}
        - task_key: silver_gold
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ./silver_gold.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: load_serving
          depends_on:
            - task_key: silver_gold
          notebook_task:
            notebook_path: ./load_serving.py
            base_parameters:
              catalog: ${var.catalog}
              grant_select_to: ${var.grant_select_to}

# The workspace host comes from DATABRICKS_HOST and credentials from the Azure CLI login
# (DATABRICKS_AUTH_TYPE=azure-cli), so the same file serves both environments.
targets:
  dev:
    workspace:
      root_path: /Shared/.bundle/${bundle.name}/dev
  prod:
    workspace:
      root_path: /Shared/.bundle/${bundle.name}/prod
