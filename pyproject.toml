[project]
name = "au-sold-prices"
version = "0.1.0"
description = "Track house sold prices in Australia."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "httpx>=0.27"]
pipeline = ["duckdb>=1.0", "psycopg[binary]>=3.1"]
api = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "psycopg[binary,pool]>=3.1",
  "pyjwt[crypto]>=2.8",
  "stripe>=10",
]

[project.scripts]
ausold = "au_sold_prices.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
au_sold_prices = ["pipeline/sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"pipelines/databricks/*.py" = ["F821"]  # notebooks use injected spark/dbutils
